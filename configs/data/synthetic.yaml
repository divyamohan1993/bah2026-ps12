# Synthetic moving-cloud dataset (the demo / smoke-test source).
# Matches frameflow.config.DataConfig. Generated by `frameflow.synthetic`.
satellite: SYNTHETIC
channel: synthetic-TIR
source: synthetic
cube_path: data/cubes/synthetic.zarr
demo_nc_dir: data/demo_nc

# Small fast grid over the Indian bbox (W, S, E, N).
bbox_west_south_east_north: [68.0, 6.0, 98.0, 38.0]
crs: EPSG:4326
resolution_deg: 0.234375   # 30deg / 128px for the 128x128 synthetic grid

chunks: [8, 512, 512]
shards: [32, 1024, 1024]
compressor: blosc-zstd-shuffle

# Fixed-range normalization to [0,1] over the physical Kelvin span (reproducible).
norm_mode: fixed_range
norm_vmin_k: 180.0
norm_vmax_k: 330.0
stats_json: norm_stats.json

patch_size: 64        # small patches for the tiny synthetic grid
cadence_min: 30
num_workers: 4

# Time-ordered split (never random — avoids temporal leakage).
train_frac: 0.8
val_frac: 0.1
test_frac: 0.1
