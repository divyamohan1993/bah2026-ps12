[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frameflow"
version = "0.1.0"
description = "AI/ML optical-flow temporal interpolation of geostationary satellite imagery (ISRO BAH 2026 PS-12)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FrameFlow Team (ISRO BAH 2026 PS-12)" }]
keywords = [
    "satellite", "frame-interpolation", "optical-flow", "VFI", "brightness-temperature",
    "INSAT", "GOES", "Himawari", "RIFE", "remote-sensing",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# `core` is the always-needed runtime (constants, contracts, synthetic, cube I/O, CLI).
# Heavy stacks live in extras so a foundation/dev install stays light. Loose pins.
dependencies = [
    "numpy>=1.24",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "h5py>=3.8",
    "zarr>=3",
    "dask>=2024.1",
    "scipy>=1.10",
    "typer>=0.9",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Mirror of the base `dependencies` so `pip install ".[core]"` is explicit/discoverable.
core = [
    "numpy>=1.24",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "h5py>=3.8",
    "zarr>=3",
    "dask>=2024.1",
    "scipy>=1.10",
    "typer>=0.9",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "h5netcdf>=1.2",
]
ml = [
    "torch>=2.1",
    "torchvision>=0.16",
    "pytorch-lightning>=2.1",
    "torchmetrics>=1.2",
    "piq>=0.8",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]
geo = [
    "pyresample>=1.27",
    "rioxarray>=0.15",
    "rasterio>=1.3",
    "satpy>=0.46",
    "s3fs>=2024.2",
    "fsspec>=2024.2",
    "pyproj>=3.6",
]
viz = [
    "matplotlib>=3.7",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
    "pillow>=10.0",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "redis>=5.0",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
frameflow = "frameflow.cli:app"

[project.urls]
Homepage = "https://github.com/"  # set to the repo URL when published
Documentation = "https://github.com/"

[tool.setuptools]
packages = ["frameflow"]

[tool.setuptools.package-data]
frameflow = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["frameflow", "scripts", "tests"]
extend-exclude = ["web", "data", "out", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "E501",  # line length handled by formatter; long docstrings/templates allowed
    "B008",  # typer uses function calls (typer.Option/Argument) in defaults by design
]

[tool.ruff.lint.isort]
known-first-party = ["frameflow"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["web/", "data/", "out/", "runs/"]
